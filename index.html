<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta description="Thing selector">

    <title>Indecision 1.0</title>

    <link rel="stylesheet" href="style.css" type="text/css">

    <link rel="apple-touch-icon" sizes="180x180" href="fav/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="fav/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="fav/favicon-16x16.png">
  </head>

  <body>
    <div id="badge" class="glyph"><span>Indecision</span> <span id="toggle"  class="glyph">➥</span></div>

    <table id="decisions">

      <thead>
        <tr>
          <th>Item</th>
          <th>Weight</th>
          <th>Active</th>
        </tr>
      </thead>

      <tbody id="items">
        <tr>
          <td contenteditable="true">Work on Indecision</td>
          <td contenteditable="true">1</td>
          <td id="precursor" class="toggle active"></td>
        </tr>
      </tbody>
    </table>

    <div id="newRow" class="glyph">
      Add new item...
    </div>

    <script src="script.js"></script>

  </body>
</html>
